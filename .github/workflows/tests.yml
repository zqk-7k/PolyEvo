name: Process rule tests
on: [push, pull_request]
jobs:
  process-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run process rule tests
        run: python -m unittest discover -s workflow/process_workflow -t workflow -p 'test_*.py' -q
